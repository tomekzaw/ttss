[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ttss"
version = "0.8.0"
description = "A Python wrapper for TTSS API."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Tomek Zawadzki", email = "tomekzawadzki98@gmail.com" },
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
dependencies = [
    "requests",
    'tzdata; platform_system == "Windows"',
]

[project.optional-dependencies]
dev = [
    "flake8",
    "freezegun",
    "mypy",
    "pytest",
    "requests-mock",
    "types-requests",
]
release = [
    "build",
    "twine",
]

[project.urls]
Homepage = "https://github.com/tomekzaw/ttss"
"Bug Tracker" = "https://github.com/tomekzaw/ttss/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ttss = ["py.typed"]

[tool.mypy]
strict = true
exclude = '^build/'
